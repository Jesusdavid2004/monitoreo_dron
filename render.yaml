# ============================================================
# Render Blueprint (Infrastructure as Code)
# Deploys the web service + a managed PostgreSQL database.
#
# Steps:
#   1. Push this repo to GitHub.
#   2. On Render: New -> Blueprint -> select this repository.
#   3. Render creates the Postgres DB and wires DATABASE_URL.
# ============================================================

services:
  - type: web
    name: drone-monitoring
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: drone-db
          property: connectionString

databases:
  - name: drone-db
    plan: free
    databaseName: drone_monitoring